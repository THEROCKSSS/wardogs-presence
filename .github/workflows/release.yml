name: Build Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Tesseract build input
        run: choco install tesseract --yes --no-progress
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build and test portable EXE
        run: python packaging/build_desktop.py
      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          $file = Get-Item -LiteralPath "dist/WardogsPresence-$version-win-x64.exe"
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: wardogs-presence-windows
          path: |
            dist/WardogsPresence-*-win-x64.exe
            dist/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          gh release create $env:GITHUB_REF_NAME "dist/WardogsPresence-$version-win-x64.exe" 'dist/SHA256SUMS.txt' --generate-notes --verify-tag --prerelease
