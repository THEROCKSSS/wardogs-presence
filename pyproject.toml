[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wardogs-presence"
version = "1.1.0"
description = "Publish your live WARDOGS server, queue, faction and score to Discord via a webhook."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Owen (THEROCKSSS)" }]
keywords = ["wardogs", "discord", "webhook", "ocr", "presence"]
dependencies = [
    "mss>=10.0.0",
    "psutil>=7.0.0",
    "pytesseract>=0.3.13",
    "pillow>=11.0.0",
    "pystray>=0.19.5",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.gui-scripts]
wardogs-presence = "wardogs_presence.cli:main"

[project.scripts]
wardogs-presence-cli = "wardogs_presence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
